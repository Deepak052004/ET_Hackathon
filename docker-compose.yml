version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: safetynexus_postgres
    environment:
      POSTGRES_USER: safetynexus
      POSTGRES_PASSWORD: safetynexus123
      POSTGRES_DB: safetynexus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetynexus -d safetynexus_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: safetynexus_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5.20-community
    container_name: safetynexus_neo4j
    environment:
      NEO4J_AUTH: neo4j/safetynexus123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.3
    container_name: safetynexus_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safetynexus_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://safetynexus:safetynexus123@postgres:5432/safetynexus_db
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: safetynexus123
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python scripts/seed.py && uvicorn app.main:socket_app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  chromadb_data:
